name: Build and publish Dicio A34
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-a34.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Test and build APK
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk'
      - name: Prepare downloads
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dicio-a34.apk
          git archive --format=zip --prefix=dicio-android/ HEAD > dicio-a34-source.zip
          sha256sum dicio-a34.apk dicio-a34-source.zip > SHA256SUMS.txt
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v4.1-a34.1 >/dev/null 2>&1; then
            gh release create v4.1-a34.1 --draft --prerelease --target "$GITHUB_SHA" --title 'Dicio A34: gastos por voz (versión de prueba)' --notes-file RELEASE-NOTES.md
          fi
          gh release upload v4.1-a34.1 dicio-a34.apk dicio-a34-source.zip SHA256SUMS.txt --clobber
          gh release edit v4.1-a34.1 --draft=false --prerelease --notes-file RELEASE-NOTES.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
